[project]
name = "adb-mdns"
description = "Custom Home Assistant integration for Android over native TLS 1.3 Wireless Debugging and mDNS"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "cryptography>=43.0.0",
    "pyOpenSSL>=24.0.0",
]

[dependency-groups]
dev = [
    "codespell>=2.3.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "E402",   # module level import not at top of file
    "SIM105", # use contextlib.suppress
    "SIM108", # use ternary operator
    "SIM118", # use key in dict
    "RUF001", # ambiguous unicode characters in string
    "RUF002", # ambiguous unicode characters in docstring
    "RUF003", # ambiguous unicode characters in comment
    "RUF022", # __all__ is not sorted
    "RUF059", # unused unpacked variable
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.codespell]
quiet-level = 2
skip = "./.git/*,./.pytest_cache/*,./.ruff_cache/*,*.png,*.pem,*.key"
ignore-words-list = "hass,dpad,recents,ime"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
